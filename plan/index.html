<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Trip | PackSmart</title>
    <!-- Base Styles -->
    <link rel="stylesheet" href="../styles.css?v=2">
    <!-- Plan Specific Styles -->
    <link rel="stylesheet" href="../plan/plan.css?v=2">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body class="plan-body">
    <!-- Navbar (simplified for subpage) -->
    <nav class="navbar scrolled" style="position: absolute;">
        <div class="nav-container">
            <a href="../dashboard/index.html" class="logo">
                <i class="fa-solid fa-suitcase-rolling"></i>
                <span>PackSmart</span>
            </a>
            <div class="nav-actions">
                <a href="../dashboard/index.html" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="plan-container">
        <div class="glass-card plan-card floating-animation" style="animation-delay: 0s;">
            
            <div class="plan-header">
                <h2>Plan Your Trip</h2>
                <p>Tell us about your upcoming adventure.</p>
                
                <!-- Progress Bar -->
                <div class="progress-indicator">
                    <div class="step active" data-step="1">1</div>
                    <div class="line"></div>
                    <div class="step" data-step="2">2</div>
                    <div class="line"></div>
                    <div class="step" data-step="3">3</div>
                </div>
            </div>

            <form id="trip-form">
                <!-- Step 1: Basics -->
                <div class="form-step active" id="step-1">
                    <h3>Where are you going?</h3>
                    <div class="input-group">
                        <label for="destination">Destination</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-location-dot"></i>
                            <input type="text" id="destination" placeholder="e.g., Bali, Indonesia" required>
                        </div>
                    </div>
                    
                    <div id="map-container" style="display: none; margin-bottom: 1.5rem;">
                        <div id="map"></div>
                    </div>
                    
                    <div class="dates-row">
                        <div class="input-group">
                            <label for="start-date">Start Date</label>
                            <div class="input-wrapper">
                                <i class="fa-regular fa-calendar"></i>
                                <input type="date" id="start-date" required>
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="end-date">End Date</label>
                            <div class="input-wrapper">
                                <i class="fa-regular fa-calendar-check"></i>
                                <input type="date" id="end-date" required>
                            </div>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="travelers">Number of Travelers</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-user-group"></i>
                            <input type="number" id="travelers" min="1" max="20" value="1" required>
                        </div>
                    </div>

                    <div class="step-actions">
                        <div></div> <!-- placeholder for flex -->
                        <button type="button" class="btn btn-primary next-btn">Next Step <i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                </div>

                <!-- Step 2: Trip Details -->
                <div class="form-step" id="step-2">
                    <h3>What kind of trip is this?</h3>
                    
                    <div class="input-group">
                        <label>Trip Type</label>
                        <div class="options-grid" id="trip-types-grid">
                            <label class="option-card">
                                <input type="checkbox" name="trip-type" value="beach" checked>
                                <div class="option-content">
                                    <i class="fa-solid fa-umbrella-beach"></i>
                                    <span>Beach</span>
                                </div>
                            </label>
                            <label class="option-card">
                                <input type="checkbox" name="trip-type" value="adventure">
                                <div class="option-content">
                                    <i class="fa-solid fa-mountain"></i>
                                    <span>Adventure</span>
                                </div>
                            </label>
                            <label class="option-card">
                                <input type="checkbox" name="trip-type" value="business">
                                <div class="option-content">
                                    <i class="fa-solid fa-briefcase"></i>
                                    <span>Business</span>
                                </div>
                            </label>
                            <label class="option-card">
                                <input type="checkbox" name="trip-type" value="family">
                                <div class="option-content">
                                    <i class="fa-solid fa-children"></i>
                                    <span>Family</span>
                                </div>
                            </label>
                            <label class="option-card">
                                <input type="checkbox" name="trip-type" value="camping">
                                <div class="option-content">
                                    <i class="fa-solid fa-campground"></i>
                                    <span>Camping</span>
                                </div>
                            </label>
                        </div>
                        <div class="custom-input-container" style="margin-top: 1rem; display: flex; gap: 0.5rem;">
                            <input type="text" id="custom-trip-type" placeholder="Add custom trip type..." class="form-control" style="flex: 1; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; padding: 0.8rem 1rem;">
                            <button type="button" id="add-custom-trip" class="btn btn-outline"><i class="fa-solid fa-plus"></i> Add</button>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Activities (Select all that apply)</label>
                        <div class="options-grid activities-grid" id="activities-grid">
                            <label class="activity-chip">
                                <input type="checkbox" value="swimming">
                                <span>Swimming</span>
                            </label>
                            <label class="activity-chip">
                                <input type="checkbox" value="trekking">
                                <span>Trekking</span>
                            </label>
                            <label class="activity-chip">
                                <input type="checkbox" value="shopping">
                                <span>Shopping</span>
                            </label>
                            <label class="activity-chip">
                                <input type="checkbox" value="photography">
                                <span>Photography</span>
                            </label>
                            <label class="activity-chip">
                                <input type="checkbox" value="hiking">
                                <span>Hiking</span>
                            </label>
                        </div>
                        <div class="custom-input-container" style="margin-top: 1rem; display: flex; gap: 0.5rem;">
                            <input type="text" id="custom-activity" placeholder="Add custom activity..." class="form-control" style="flex: 1; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; padding: 0.8rem 1rem;">
                            <button type="button" id="add-custom-activity" class="btn btn-outline"><i class="fa-solid fa-plus"></i> Add</button>
                        </div>
                    </div>

                    <div class="step-actions">
                        <button type="button" class="btn btn-outline prev-btn"><i class="fa-solid fa-arrow-left"></i> Back</button>
                        <button type="button" class="btn btn-primary next-btn" id="step-1-next">Next Step <i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                </div>

                <!-- Step 3: Analysis & Generation -->
                <div class="form-step" id="step-3">
                    <h3>Ready to generate your list?</h3>
                    
                    <div class="summary-box">
                        <div class="summary-item">
                            <i class="fa-solid fa-location-dot"></i>
                            <div class="summary-text">
                                <span class="summary-label">Destination</span>
                                <span class="summary-value" id="summary-dest">...</span>
                            </div>
                        </div>
                        <div class="summary-item">
                            <i class="fa-regular fa-calendar"></i>
                            <div class="summary-text">
                                <span class="summary-label">Dates</span>
                                <span class="summary-value" id="summary-dates">...</span>
                            </div>
                        </div>
                        <div class="summary-item">
                            <i class="fa-solid fa-tags"></i>
                            <div class="summary-text">
                                <span class="summary-label">Trip Type</span>
                                <span class="summary-value" id="summary-type">...</span>
                            </div>
                        </div>
                    </div>

                    <div class="final-actions">
                        <button type="button" class="btn btn-secondary action-btn" id="analyze-weather-btn">
                            <i class="fa-solid fa-cloud-sun-rain"></i> Analyze Weather
                        </button>
                        <button type="button" class="btn btn-primary action-btn generate-btn" id="generate-list-btn">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> Generate Packing List
                        </button>
                    </div>
                    
                    <div id="loading-area" class="loading-area" style="display: none;">
                        <i class="fa-solid fa-circle-notch fa-spin"></i>
                        <p id="loading-text">Analyzing data...</p>
                    </div>

                    <div class="step-actions">
                        <button type="button" class="btn btn-outline prev-btn"><i class="fa-solid fa-arrow-left"></i> Back</button>
                    </div>
                </div>

            </form>
        </div>
        
        <!-- Decorative Blobs -->
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="../plan/config.js" onerror="console.warn('config.js not found, using default options')"></script>
    <script src="../plan/plan.js?v=3"></script>
</body>
</html>
